name: npx-check
# Proves the npx install (from this repo and from the site tarball) starts the MCP server on all 3 OSes.
on:
  push:
    branches: [main]
    paths: [package.json, 'source/app/src/**', 'source/catalog/**']
  workflow_dispatch:
jobs:
  npx:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, macos-latest, windows-latest], node: [20, 22, 24] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - name: Start MCP server via npx from GitHub and list tools
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > req.txt
          (cat req.txt; sleep 20) | npx -y "github:${GITHUB_REPOSITORY}" > out.txt 2> err.txt || true
          cat err.txt
          node -e "const l=require('fs').readFileSync('out.txt','utf8').trim().split('\n').map(JSON.parse);const t=l.find(m=>m.id===2).result.tools;console.log(t.length,'tools');if(t.length<20||!t.some(x=>x.name==='gui_hub_status'))process.exit(1)"
      - name: Agent command line via npx (guihub list / info / bad usage exit code)
        shell: bash
        run: |
          npx -y -p "github:${GITHUB_REPOSITORY}" guihub list > list.txt
          grep -q speak_speak list.txt && grep -q pdfcpu_form_fill list.txt
          npx -y -p "github:${GITHUB_REPOSITORY}" guihub info transcribe_subtitles | grep -q -- '--input'
          set +e; npx -y -p "github:${GITHUB_REPOSITORY}" guihub run speak_speak > /dev/null; code=$?; set -e
          test "$code" = 2
