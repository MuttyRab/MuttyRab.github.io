name: release
# Lives in the public MuttyRab.github.io repo (copied there by scripts/publish.sh from Gui-hub).
# Builds installers from source/ on all three OSes and publishes them as a GitHub release
# whenever source/app/package.json changes (i.e. the version was bumped), or on manual run.
on:
  push:
    branches: [main]
    paths: ['source/app/package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: source/app
      - run: npm test
        working-directory: source/app
      - name: Build installers (unsigned)
        working-directory: source/app
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --publish never
      - name: Test the packaged app (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: source/app
        run: E2E_PACKAGED="$PWD/dist/linux-unpacked/gui-hub" xvfb-run -a node test/e2e.js "$RUNNER_TEMP/shots"
      - name: Test the packaged app (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: source/app
        run: |
          exe="$(ls -d dist/mac*/GUI\ Hub.app | head -1)/Contents/MacOS/GUI Hub"
          app="$(dirname "$(dirname "$(dirname "$exe")")")"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"
          echo "ad-hoc signature valid"
          E2E_PACKAGED="$PWD/$exe" node test/e2e.js "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            source/app/dist/*.dmg
            source/app/dist/*.exe
            source/app/dist/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v="v$(node -p "require('./source/app/package.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" out/* --clobber
          else
            gh release create "$v" out/* --title "GUI Hub $v" --notes "Download for your computer at https://muttyrab.github.io" --latest
          fi

  # One-file MCP bundle (Claude Desktop extension) + listing in the official MCP Registry.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build gui-hub.mcpb and server.json
        run: |
          v="v$(node -p "require('./source/app/package.json').version")"
          echo "TAG=$v" >> "$GITHUB_ENV"
          node source/scripts/build-mcpb.js source/app source/catalog out "https://github.com/${GITHUB_REPOSITORY}/releases/download/$v"
      - name: Attach bundle to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "$TAG" out/gui-hub.mcpb --clobber
      - name: Publish to the MCP Registry
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$archive"
          tar xzf "$archive" mcp-publisher
          cp out/server.json server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
