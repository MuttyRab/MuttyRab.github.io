name: release
# Lives in the public website repo (copied there by scripts/publish.sh from Gui-hub).
# Builds installers from source/ on all three OSes and publishes them as a GitHub release
# whenever source/app/package.json changes (i.e. the version was bumped), or on manual run.
on:
  push:
    branches: [main]
    paths: ['source/app/package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        product: [essentials, data, audio]   # each GUI Hub product is its own app (catalog/products.json)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: source/app
      - run: npm test
        working-directory: source/app
      - name: Turn the source into the ${{ matrix.product }} app
        run: node source/scripts/set-product.js ${{ matrix.product }} source/app source/catalog
      - name: Put every engine inside the installer (works offline out of the box)
        shell: bash
        run: |
          case "${{ runner.os }}" in Linux) keys=linux-x64;; Windows) keys=win32-x64;; macOS) keys="darwin-arm64 darwin-x64";; esac
          node source/scripts/bundle-engines.js ${{ matrix.product }} source/app/engines --by-arch $keys
          du -sh source/app/engines/* || true
      - name: Build installers (unsigned)
        working-directory: source/app
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --publish never
      - name: Test the packaged app (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.product == 'essentials'
        working-directory: source/app
        run: E2E_PACKAGED="$PWD/dist/linux-unpacked/gui-hub-essentials" xvfb-run -a node test/e2e.js "$RUNNER_TEMP/shots"
      - name: Packaged app serves only its own product's AI tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: source/app
        shell: bash
        run: |
          exe="$PWD/dist/linux-unpacked/gui-hub-${{ matrix.product }}"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > req.txt
          (cat req.txt; sleep 8) | ELECTRON_RUN_AS_NODE=1 GUIHUB_USER_DATA="$RUNNER_TEMP/ud" "$exe" "$PWD/dist/linux-unpacked/resources/app.asar.unpacked/src/mcp-entry.js" > out.txt
          node -e "const l=require('fs').readFileSync('out.txt','utf8').trim().split('\n').map(JSON.parse);const t=l.find(m=>m.id===2).result.tools.map(x=>x.name);console.log(t.join(' '));const want={essentials:'ffmpeg_compress',data:'duckdb_query',audio:'speak_speak'}['${{ matrix.product }}'];const other={essentials:'duckdb_query',data:'ffmpeg_compress',audio:'ffmpeg_compress'}['${{ matrix.product }}'];if(!t.includes(want)||t.includes(other))process.exit(1)"
      - name: Test the packaged app (macOS)
        if: matrix.os == 'macos-latest' && matrix.product == 'essentials'
        working-directory: source/app
        run: |
          exe="$(ls -d dist/mac*/*.app | head -1)/Contents/MacOS/GUI Hub Essentials"
          app="$(dirname "$(dirname "$(dirname "$exe")")")"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"
          echo "ad-hoc signature valid"
          E2E_PACKAGED="$PWD/$exe" node test/e2e.js "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.product }}
          path: |
            source/app/dist/*.dmg
            source/app/dist/*.exe
            source/app/dist/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v="v$(node -p "require('./source/app/package.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" out/* --clobber
          else
            gh release create "$v" out/* --title "GUI Hub $v" --notes "Download for your computer at https://guihub.cc" --latest
          fi

  # One-file MCP bundle (Claude Desktop extension) + listing in the official MCP Registry.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build one Claude extension (.mcpb) + registry entry per product
        run: |
          v="v$(node -p "require('./source/app/package.json').version")"
          echo "TAG=$v" >> "$GITHUB_ENV"
          for p in $(node -p "require('./source/catalog/products.json').products.map(p=>p.id).join(' ')"); do
            node source/scripts/build-mcpb.js source/app source/catalog out "https://github.com/${GITHUB_REPOSITORY}/releases/download/$v" "$p"
          done
          cp out/gui-hub-essentials.mcpb out/gui-hub.mcpb   # old download links keep working
      - name: Attach bundles to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "$TAG" out/*.mcpb --clobber
      - name: Publish to the MCP Registry
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          for f in out/server-*.json; do cp "$f" server.json; ./mcp-publisher publish; done
